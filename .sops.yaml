creation_rules:
  # Secrets only one host may read, like its Nix signing key.
  - path_regex: secrets/kobold\.yaml$
    key_groups:
      - age: [*admin, *kobold]
  - path_regex: secrets/lugh\.yaml$
    key_groups:
      - age: [*admin, *lugh]
  - path_regex: secrets/nabu\.yaml$
    key_groups:
      - age: [*admin, *nabu]
  - path_regex: secrets/tenjin\.yaml$
    key_groups:
      - age: [*admin, *tenjin]
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age: [*admin, *lugh, *tenjin, *kobold, *nabu]
