[package]
name = "comfyui-gate"
version = "0.1.0"
edition = "2024"
description = "Lets Krita use lugh's ComfyUI while llama-swap shares its card with the helper model"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
