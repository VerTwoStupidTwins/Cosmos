<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmos Chat</title>
<style>
:root {
	--bg: #f6f5f2; --panel: #ffffff; --line: #e3e1db; --text: #1d1c1a; --muted: #6d6a63;
	--accent: #3d6b5a; --accent-text: #ffffff; --user: #e7efe9; --code: #f0eee9; --warn: #9a5b13; --danger: #a33a2f;
	--main: #3d6b5a; --work: #7a4fa0;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #161615; --panel: #1f1f1d; --line: #33322f; --text: #e9e7e2; --muted: #9b978e;
		--accent: #6fa58f; --accent-text: #0d1310; --user: #26332c; --code: #2a2926; --warn: #e0a35a; --danger: #e07a6e;
		--main: #6fa58f; --work: #b48ad6;
	}
}
:root[data-theme="dark"] {
	--bg: #161615; --panel: #1f1f1d; --line: #33322f; --text: #e9e7e2; --muted: #9b978e;
	--accent: #6fa58f; --accent-text: #0d1310; --user: #26332c; --code: #2a2926; --warn: #e0a35a; --danger: #e07a6e;
	--main: #6fa58f; --work: #b48ad6;
}
* { box-sizing: border-box; }
/* The page never scrolls: the window holds the bar, the chat list and the composer, and only the messages scroll. */
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: default; }
.app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 14px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
aside header h1 { font-size: 15px; margin: 0; flex: 1; letter-spacing: .02em; }
#chats { overflow-y: auto; flex: 1; padding: 6px; }
aside footer { border-top: 1px solid var(--line); padding: 6px; display: grid; gap: 2px; }
.chat-link, .side-link { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; }
.chat-link:hover, .side-link:hover { background: var(--bg); }
.chat-link.active, .side-link.active { background: var(--user); }
.chat-link .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-link .m { font-size: 12px; color: var(--muted); }
main { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.bar h2 { font-size: 15px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menu { display: none; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.badge.main { color: var(--main); } .badge.work { color: var(--work); }
details.more { position: relative; }
details.more summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
details.more summary::-webkit-details-marker { display: none; }
details.more .pop { position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; display: grid; min-width: 150px; z-index: 3; box-shadow: 0 8px 24px #0003; }
details.more .pop button { border: 0; text-align: left; }
details.more .pop button:hover { background: var(--bg); }
#log { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
.inner { max-width: 780px; margin: 0 auto; }
.msg { margin: 0 0 16px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: var(--user); border-radius: 14px 14px 4px 14px; padding: 8px 13px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .from { font-size: 11px; color: var(--muted); text-align: right; }
.msg.answer .body { overflow-wrap: anywhere; }
.msg.answer .body > :first-child { margin-top: 0; } .msg.answer .body > :last-child { margin-bottom: 0; }
.msg.notice { text-align: center; color: var(--muted); font-size: 13px; }
.msg.pending .body { color: var(--muted); }
pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
code { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: .92em; }
:not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
table { border-collapse: collapse; } td, th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
details.tools { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
details.tools summary { cursor: pointer; }
details.tools .call { margin: 6px 0 0 4px; padding-left: 10px; border-left: 2px solid var(--line); }
details.tools .call pre { margin: 4px 0; max-height: 240px; }
.err { color: var(--warn); }
.banner { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin: 0 0 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner span { flex: 1; }
.approval code { flex: 1 1 100%; }
form.compose { padding: 10px 16px 16px; }
form.compose .inner { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; max-height: 40vh; }
textarea:focus, button:focus-visible, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; }
.login { display: grid; place-items: center; height: 100%; padding: 16px; }
.login form { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: min(360px, 100%); display: grid; gap: 12px; }
.login h1 { margin: 0; font-size: 18px; }
.login input { font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.panel h3 { font-size: 14px; margin: 22px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.panel h3:first-child { margin-top: 0; }
.panel table { width: 100%; font-size: 14px; }
.panel td.n { text-align: right; font-variant-numeric: tabular-nums; }
.panel .row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.panel .row .grow { flex: 1; min-width: 0; }
.panel .row .grow .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel .sub { font-size: 12px; color: var(--muted); }
.panel ul.changes { padding-left: 18px; margin: 0; font-size: 14px; }
.panel ul.changes li { margin: 0 0 6px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 110px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.dots::after { content: "…"; animation: blink 1.2s infinite; } @keyframes blink { 50% { opacity: .2; } }
@media (max-width: 760px) {
	.app { grid-template-columns: 1fr; }
	aside { position: fixed; inset: 0 25% 0 0; z-index: 2; transform: translateX(-105%); transition: transform .2s; }
	.app.menu-open aside { transform: none; box-shadow: 0 0 40px #0006; }
	#menu { display: inline-block; }
	#log, form.compose, .bar { padding-left: 16px; padding-right: 16px; }
	#switch { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { marked } from "/marked.js";

// Raw HTML in markdown (from the model or tool output) is shown as text, never rendered.
const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
marked.use({ gfm: true, breaks: false, renderer: { html: (token) => escape(token.text ?? token.raw ?? "") } });
const md = (text) => marked.parse(text ?? "");

const MAIN = "main";
const root = document.getElementById("root");
let chats = [];
let trashCount = 0;
let view = "chat"; // chat | memory | trash
let current = null; // chat id
let source = null; // EventSource
let state = { chat: null, items: [], busy: false, partial: "", truncated: false };

async function api(method, path, body) {
	const response = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
	if (response.status === 401 && path !== "/api/login") { showLogin(); throw new Error("sign in"); }
	const json = await response.json().catch(() => ({}));
	if (!response.ok) throw new Error(json.error ?? response.statusText);
	return json;
}
const fail = (e) => { if (e.message !== "sign in") alert(e.message); };

function showLogin(error) {
	if (source) source.close();
	root.innerHTML = `<div class="login"><form><h1>Cosmos Chat</h1>
		<input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
		<button class="primary">Sign in</button><div class="err">${error ? escape(error) : ""}</div></form></div>`;
	root.querySelector("form").onsubmit = async (event) => {
		event.preventDefault();
		try {
			await api("POST", "/api/login", { password: event.target.password.value });
			start();
		} catch (e) { showLogin(e.message); }
	};
}

function shell() {
	root.innerHTML = `<div class="app">
		<aside><header><h1>Cosmos Chat</h1><button id="new" class="primary">New</button></header>
			<nav id="chats"></nav>
			<footer><button class="side-link" id="go-memory">🧠 Memory</button><button class="side-link" id="go-trash">🗑 Trash</button></footer></aside>
		<main>
			<div class="bar"><button id="menu" aria-label="Chats">☰</button><h2 id="title">New chat</h2>
				<span id="badge" class="badge main" hidden></span><button id="switch" hidden></button>
				<details class="more" id="more" hidden><summary aria-label="Chat options">⋯</summary><div class="pop">
					<button id="do-rename">Rename</button><button id="do-pin">Pin</button><button id="do-switch">Switch model</button>
					<button id="do-delete" class="danger">Delete</button></div></details></div>
			<div id="log"><div class="inner" id="items"></div></div>
			<form class="compose"><div class="inner">
				<textarea id="text" rows="1" placeholder="Message main…" autofocus></textarea>
				<button class="primary" id="send">Send</button></div></form>
		</main></div>`;
	const app = root.querySelector(".app");
	const closeMenu = () => app.classList.remove("menu-open");
	document.getElementById("menu").onclick = () => app.classList.toggle("menu-open");
	document.getElementById("new").onclick = () => { open(null); closeMenu(); };
	document.getElementById("go-memory").onclick = () => { showMemory(); closeMenu(); };
	document.getElementById("go-trash").onclick = () => { showTrash(); closeMenu(); };
	document.getElementById("switch").onclick = switchModel;
	document.getElementById("do-switch").onclick = () => { closeMore(); switchModel(); };
	document.getElementById("do-rename").onclick = rename;
	document.getElementById("do-pin").onclick = pin;
	document.getElementById("do-delete").onclick = remove;
	document.addEventListener("click", (event) => { if (!event.target.closest("#more")) closeMore(); });
	const text = document.getElementById("text");
	text.addEventListener("input", () => { text.style.height = "auto"; text.style.height = `${text.scrollHeight}px`; });
	text.addEventListener("keydown", (event) => {
		if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); root.querySelector("form.compose").requestSubmit(); }
	});
	root.querySelector("form.compose").onsubmit = send;
}
const closeMore = () => { const more = document.getElementById("more"); if (more) more.open = false; };

async function refreshList() {
	try {
		chats = (await api("GET", "/api/chats")).chats;
		trashCount = (await api("GET", "/api/trash")).chats.length;
	} catch { return; }
	const nav = document.getElementById("chats");
	if (!nav) return;
	nav.innerHTML = chats.map((c) => `<button class="chat-link${view === "chat" && c.id === current ? " active" : ""}" data-id="${c.id}">
		<span class="t">${c.pinned ? "📌 " : ""}${escape(c.title)}</span><span class="m">${escape(c.model)}${c.busy ? " · answering" : ""} · ${ago(c.updated)}</span></button>`).join("")
		|| `<p class="empty" style="margin:20px 8px;font-size:13px">No chats yet.</p>`;
	for (const button of nav.querySelectorAll(".chat-link")) button.onclick = () => { open(button.dataset.id); root.querySelector(".app").classList.remove("menu-open"); };
	document.getElementById("go-trash").textContent = `🗑 Trash${trashCount ? ` (${trashCount})` : ""}`;
	document.getElementById("go-memory").classList.toggle("active", view === "memory");
	document.getElementById("go-trash").classList.toggle("active", view === "trash");
}

function ago(ms) {
	const s = (Date.now() - ms) / 1000;
	if (s < 60) return "now";
	if (s < 3600) return `${Math.floor(s / 60)} min`;
	if (s < 86400) return `${Math.floor(s / 3600)} h`;
	return new Date(ms).toLocaleDateString();
}
const when = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: "short", timeStyle: "short" }) : "—");

function setBar({ title, chat = null, compose = true }) {
	document.getElementById("title").textContent = title;
	const badge = document.getElementById("badge");
	const swap = document.getElementById("switch");
	const more = document.getElementById("more");
	const live = chat && !chat.deleted;
	badge.hidden = !chat;
	swap.hidden = more.hidden = !live;
	if (chat) {
		const onMain = chat.model === MAIN;
		badge.textContent = chat.deleted ? "in the Trash" : chat.model;
		badge.className = `badge ${chat.deleted ? "" : onMain ? "main" : "work"}`;
		swap.textContent = onMain ? "Hand to workhorse" : "Back to main";
		document.getElementById("do-pin").textContent = chat.pinned ? "Unpin" : "Pin";
		document.getElementById("do-switch").textContent = onMain ? "Hand to workhorse" : "Back to main";
	}
	root.querySelector("form.compose").hidden = !compose || (chat && chat.deleted);
	document.getElementById("text").placeholder = `Message ${chat?.model ?? MAIN}…`;
}

function leaveChat() {
	if (source) { source.close(); source = null; }
	state = { chat: null, items: [], busy: false, partial: "", truncated: false };
}

function open(id) {
	view = "chat";
	current = id;
	leaveChat();
	render();
	refreshList();
	if (id) {
		history.replaceState(null, "", `#${id}`);
		source = new EventSource(`/api/chats/${id}/events`);
		source.onmessage = (event) => {
			const data = JSON.parse(event.data);
			const listChanged = state.chat && ["title", "model", "busy", "pinned", "deleted"].some((k) => data.chat?.[k] !== state.chat[k]);
			state.chat = data.chat;
			if (data.items) { state.items = data.items; state.truncated = data.truncated; }
			state.busy = data.busy || data.chat?.busy;
			state.partial = data.partial;
			if (view === "chat" && current === id) render();
			if (listChanged) refreshList();
		};
	} else history.replaceState(null, "", location.pathname);
	document.getElementById("text").focus();
}

function render() {
	const log = document.getElementById("log");
	const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
	const chat = state.chat;
	setBar({ title: chat?.title ?? "New chat", chat });
	const parts = [];
	if (chat?.deleted) {
		parts.push(`<div class="banner"><span>🗑 In the Trash since ${when(new Date(chat.deleted).toISOString())}. Its ideas went to memory; restore it to carry on.</span>
			<button class="primary" id="restore-here">Restore</button></div>`);
	}
	if (state.truncated) parts.push(`<div class="msg notice">Earlier messages aren't shown.</div>`);
	if (!current) parts.push(`<p class="empty">Start a chat with main. It hands over to workhorse when the talk turns to work.</p>`);
	for (const item of state.items) parts.push(renderItem(item));
	for (const a of chat?.approvals ?? []) {
		parts.push(`<div class="banner approval"><span>🔐 Approval needed</span><code>${escape(a.call)}</code>
			<button class="primary" data-approve="${escape(a.event)}">Approve</button><button data-deny="${escape(a.event)}">Deny</button></div>`);
	}
	if (state.busy) {
		parts.push(state.partial
			? `<div class="msg answer pending"><div class="body">${md(state.partial)}</div></div>`
			: `<div class="msg notice"><span class="dots">${escape(chat?.model ?? MAIN)} is thinking</span></div>`);
	}
	document.getElementById("items").innerHTML = parts.join("");
	document.getElementById("restore-here")?.addEventListener("click", () => restore(current));
	for (const b of document.querySelectorAll("[data-approve],[data-deny]")) {
		b.onclick = () => api("POST", `/api/chats/${current}/approve`, { event: b.dataset.approve ?? b.dataset.deny, allow: b.dataset.approve !== undefined }).catch(fail);
	}
	if (stick) log.scrollTop = log.scrollHeight;
}

function renderItem(item) {
	if (item.kind === "user") {
		return `<div class="msg user"><div><div class="bubble">${escape(item.text)}</div>${item.from === "matrix" ? `<div class="from">from the phone</div>` : ""}</div></div>`;
	}
	if (item.kind === "notice") return `<div class="msg notice">${escape(item.text)}</div>`;
	const tools = item.tools.length
		? `<details class="tools"><summary>${item.tools.length} tool call${item.tools.length > 1 ? "s" : ""}: ${escape(item.tools.map((t) => t.name).join(", "))}</summary>
			${item.tools.map((t) => `<div class="call"><code>${escape(t.name)}</code> <code>${escape(t.args)}</code>
				${t.result !== undefined ? `<pre class="${t.error ? "err" : ""}">${escape(t.result)}</pre>` : ""}</div>`).join("")}</details>`
		: "";
	return `<div class="msg answer">${tools}<div class="body">${md(item.text)}</div></div>`;
}

async function send(event) {
	event.preventDefault();
	const box = document.getElementById("text");
	const text = box.value.trim();
	if (!text) return;
	const button = document.getElementById("send");
	button.disabled = true;
	try {
		if (current) await api("POST", `/api/chats/${current}/messages`, { text });
		else open((await api("POST", "/api/chats", { text })).id);
		box.value = "";
		box.style.height = "auto";
	} catch (e) { fail(e); } finally { button.disabled = false; }
}

async function switchModel() {
	if (!state.chat) return;
	await api("POST", `/api/chats/${current}/model`, { model: state.chat.model === MAIN ? "workhorse" : MAIN }).catch(fail);
}

async function rename() {
	closeMore();
	const title = prompt("Rename chat", state.chat?.title ?? "");
	if (!title?.trim()) return;
	await api("POST", `/api/chats/${current}/rename`, { title }).catch(fail);
	refreshList();
}

async function pin() {
	closeMore();
	await api("POST", `/api/chats/${current}/pin`, { pinned: !state.chat?.pinned }).catch(fail);
	refreshList();
}

async function remove() {
	closeMore();
	if (!confirm(`Move "${state.chat?.title}" to the Trash?\n\nIt disappears here and in Matrix now; its ideas go to memory first, and you can restore it for 7 days.`)) return;
	try {
		await api("POST", `/api/chats/${current}/delete`, {});
		open(null);
	} catch (e) { fail(e); }
}

async function restore(id) {
	try {
		await api("POST", `/api/chats/${id}/restore`, {});
		open(id);
	} catch (e) { fail(e); }
}

async function showTrash() {
	view = "trash";
	current = null;
	leaveChat();
	history.replaceState(null, "", "#trash");
	setBar({ title: "Trash", compose: false });
	refreshList();
	const items = document.getElementById("items");
	try {
		const { chats: trashed } = await api("GET", "/api/trash");
		items.innerHTML = `<div class="panel"><h3>Deleted chats</h3>
			<p class="sub">Each stays here for 7 days. Its ideas and plans go to memory as soon as it's deleted, and memory keeps the whole chat.</p>
			${trashed.map((c) => `<div class="row"><div class="grow"><div class="t">${escape(c.title)}</div>
				<div class="sub">deleted ${when(new Date(c.deleted).toISOString())} · ${c.consolidated ? "in memory" : "going to memory"} · gone ${when(new Date(c.gone).toISOString())}</div></div>
				<button data-view="${c.id}">View</button><button class="primary" data-restore="${c.id}">Restore</button></div>`).join("")
			|| `<p class="empty">The Trash is empty.</p>`}</div>`;
		for (const b of items.querySelectorAll("[data-restore]")) b.onclick = () => restore(b.dataset.restore);
		for (const b of items.querySelectorAll("[data-view]")) b.onclick = () => open(b.dataset.view);
	} catch (e) { fail(e); }
}

async function showMemory() {
	view = "memory";
	current = null;
	leaveChat();
	history.replaceState(null, "", "#memory");
	setBar({ title: "Memory", compose: false });
	refreshList();
	const items = document.getElementById("items");
	items.innerHTML = `<p class="empty dots">Loading</p>`;
	try {
		const m = await api("GET", "/api/memory/status");
		if (!m.enabled) { items.innerHTML = `<p class="empty">Memory isn't set up.</p>`; return; }
		const total = m.items.reduce((n, i) => n + i.count, 0);
		const exchanges = m.conversations.reduce((n, c) => n + c.exchanges, 0);
		items.innerHTML = `<div class="panel">
			<div class="stats">
				<div class="stat"><b>${total}</b><span>items kept</span></div>
				<div class="stat"><b>${exchanges}</b><span>exchanges stored</span></div>
				<div class="stat"><b>${m.waiting.length}</b><span>waiting to consolidate</span></div>
				<div class="stat"><b>${m.unindexed + m.unannounced + m.owedToMemory}</b><span>backlog</span></div>
			</div>
			<h3>Conversations</h3>
			<table><tr><th>Conversation</th><th>Stored</th><th>Consolidated</th><th>Topics</th><th>Next</th></tr>
			${m.conversations.map((c) => `<tr><td>${escape(c.name)}</td><td class="n">${c.exchanges}</td><td class="n">${c.consolidated}</td><td class="n">${c.topics}</td>
				<td>${c.consolidateAt ? when(c.consolidateAt) : "—"}</td></tr>`).join("")}</table>
			<h3>Items</h3>
			<table><tr><th>Kind</th><th>Status</th><th>Count</th></tr>
			${m.items.map((i) => `<tr><td>${escape(i.kind)}</td><td>${escape(i.status.replace("_", " ") || "—")}</td><td class="n">${i.count}</td></tr>`).join("") || `<tr><td colspan="3">None yet</td></tr>`}</table>
			<p class="sub">${m.core} core · ${m.retracted} retracted · ${m.unindexed} waiting to be indexed · ${m.unannounced} not announced yet</p>
			<h3>Latest changes</h3>
			<ul class="changes">${m.changes.map((c) => `<li>${escape(c.notice_text)} <span class="sub">${when(c.at)} · ${escape(c.origin)}</span></li>`).join("") || "<li>None yet</li>"}</ul>
			<p class="sub">Read-only. Correct a memory with a reply under its notice in Matrix's Memory room, or ❌ to undo it.</p></div>`;
	} catch (e) { items.innerHTML = ""; fail(e); }
}

async function start() {
	try { await api("GET", "/api/chats"); } catch { return; }
	shell();
	await refreshList();
	const wanted = location.hash.slice(1);
	if (wanted === "memory") showMemory();
	else if (wanted === "trash") showTrash();
	else open(chats.some((c) => c.id === wanted) ? wanted : null);
	setInterval(refreshList, 15000);
}
start();
</script>
</body>
