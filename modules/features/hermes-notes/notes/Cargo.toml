[package]
name = "notes"
version = "0.1.0"
edition = "2024"
description = "The owner's Notes vault on lugh: transcribes handwritten drawings into inbox notes, and deletes and lists reviewed ones for Hermes' nightly job"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
notify-debouncer-mini = "0.7"
regex = "1"
serde_json = "1"
sha2 = "0.10"
# Plain HTTP to llama-swap on localhost, so no TLS.
ureq = { version = "2", default-features = false, features = ["json"] }
yaml-rust2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
