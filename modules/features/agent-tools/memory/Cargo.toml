[package]
name = "memory"
version = "0.1.0"
edition = "2024"
description = "The homelab agent's long-term memory: items, topics and past conversations in SQLite, searched through Qdrant, as an MCP server over stdio"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
# Plain HTTP to Qdrant on localhost and to nabu over NetBird: no TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.10", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[profile.release]
lto = "thin"
