[package]
name = "memory"
version = "0.1.0"
edition = "2024"
description = "The homelab agent's long-term memory: items, topics and past conversations in SQLite, searched through Qdrant, as an MCP server over stdio or HTTP"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
# Plain HTTP to Qdrant on localhost and to nabu over NetBird: no TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3.10", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
