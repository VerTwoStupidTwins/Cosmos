# .forgejo/workflows/ci.yml
# Runs on lugh's runner, straight on the host (modules/features/forgejo.nix): builds use lugh's Nix store, so whatever
# is built here is in the binary cache by the time a host rebuilds.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      # The same hooks as before each commit (modules/git-hooks.nix): formatting and dead code, over the whole repo.
      - name: Formatting and dead code
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.pre-commit

  build:
    runs-on: native
    steps:
      - uses: actions/checkout@v4
      - name: Build every host
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]')
          echo "Hosts: $(echo $hosts)"
          nix build --no-link --print-build-logs --keep-going \
            $(for host in $hosts; do echo ".#nixosConfigurations.$host.config.system.build.toplevel"; done)
      # Main's builds are kept from lugh's garbage collection (nh clean) by a link each in the runner's home, replaced
      # every run, so the weekly update's "before" builds and the next rebuild never have to start over.
      - name: Keep main's builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$HOME/gcroots"
          for host in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            nix build --out-link "$HOME/gcroots/main-$host" ".#nixosConfigurations.$host.config.system.build.toplevel"
          done
          ls -l "$HOME/gcroots"
