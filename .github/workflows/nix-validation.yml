name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs need only read access. No secrets or deployment credentials are required.
permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate Cosmos (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Cosmos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluate flake outputs without compiling the whole NixOS desktop.
      - name: Validate flake outputs
        run: nix flake check --no-build --show-trace

      # Discover and evaluate all configured NixOS hosts, including future hosts.
      - name: Evaluate all NixOS host derivations
        shell: bash
        run: |
          hosts_json="$(nix eval --json --apply builtins.attrNames '.#nixosConfigurations')"
          mapfile -t hosts < <(jq -r '.[]' <<< "$hosts_json")
          if (( ${#hosts[@]} == 0 )); then
            echo "::error::No NixOS hosts defined"
            exit 1
          fi
          for host in "${hosts[@]}"; do
            echo "::group::Evaluate $host"
            nix eval --raw ".#nixosConfigurations.\"$host\".config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

      # Hibernation must point to the encrypted LVM swap, not the empty default.
      - name: Verify Thoth hibernation resume device
        shell: bash
        run: |
          resume="$(nix eval --raw '.#nixosConfigurations.thoth.config.boot.resumeDevice')"
          swap="$(nix eval --raw --apply 'swaps: (builtins.head swaps).device' '.#nixosConfigurations.thoth.config.swapDevices')"
          if [[ "$resume" != "/dev/nixos/swap" || "$swap" != "$resume" ]]; then
            echo "::error::Thoth resume '$resume' must match swap '$swap' at /dev/nixos/swap"
            exit 1
          fi

      # Regression check for unattended laptop hibernation and UPower thresholds.
      - name: Verify Thoth laptop power policy
        shell: bash
        run: |
          lid="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.logind.settings.Login.HandleLidSwitch')"
          delay="$(nix eval --raw '.#nixosConfigurations.thoth.config.systemd.sleep.settings.Sleep.HibernateDelaySec')"
          battery_action="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.upower.criticalPowerAction')"
          battery_percent="$(nix eval --json '.#nixosConfigurations.thoth.config.services.upower.percentageAction')"
          upower_enabled="$(nix eval --json '.#nixosConfigurations.thoth.config.services.upower.enable')"
          [[ "$lid" == "suspend-then-hibernate" ]] || exit 1
          [[ "$delay" == "60min" ]] || exit 1
          [[ "$battery_action" == "Hibernate" ]] || exit 1
          [[ "$battery_percent" == "8" && "$upower_enabled" == "true" ]] || exit 1

      # Regression check for the previously mismatched NetBird client/interface.
      - name: Verify NetBird interface
        shell: bash
        run: |
          interface="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.netbird.clients.wt0.interface')"
          if [[ "$interface" != "wt0" ]]; then
            echo "::error::Expected NetBird interface wt0; got '$interface'"
            exit 1
          fi

  lint:
    name: Nix style and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Cosmos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Packages are supplied by the pinned Cosmos development shell.
      - name: Statix
        run: nix develop --command statix check .

      - name: Deadnix
        if: ${{ success() || failure() }}
        run: nix develop --command deadnix --fail .

      # Format only in CI's disposable checkout; fail with the resulting diff.
      # This never commits or changes the contributor's working tree.
      - name: Nixfmt
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          nix develop --command bash -euo pipefail -c '
            git ls-files -z -- "*.nix" | xargs -0 -r -n1 nixfmt
            git diff --exit-code -- "*.nix"
          '
