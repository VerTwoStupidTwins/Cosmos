name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs need only read access. No secrets or deployment credentials are required.
permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate Cosmos (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Cosmos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluate flake outputs without compiling the whole NixOS desktop.
      - name: Validate flake outputs
        run: nix flake check --no-build --show-trace

      - name: Evaluate Thoth system derivation
        run: nix eval --raw '.#nixosConfigurations.thoth.config.system.build.toplevel.drvPath'

      # Regression check for the previously mismatched NetBird client/interface.
      - name: Verify NetBird interface
        shell: bash
        run: |
          interface="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.netbird.clients.wt0.interface')"
          if [[ "$interface" != "wt0" ]]; then
            echo "::error::Expected NetBird interface wt0; got '$interface'"
            exit 1
          fi
