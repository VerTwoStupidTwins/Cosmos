name: Nix validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs need only read access. No secrets or deployment credentials are required.
permissions:
  contents: read

concurrency:
  group: nix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate Cosmos (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Cosmos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluate host derivations with a writable store before read-only flake checks.
      # Hermes upstream uses filtered source paths when uv2nix reads uv.lock;
      # nix flake check --no-build on a clean store cannot realise those paths.
      # Workaround until https://github.com/NousResearch/hermes-agent/pull/71228 lands.
      # Discover and evaluate all configured NixOS hosts, including future hosts.
      - name: Evaluate all NixOS host derivations
        shell: bash
        run: |
          hosts_json="$(nix eval --json --apply builtins.attrNames '.#nixosConfigurations')"
          mapfile -t hosts < <(jq -r '.[]' <<< "$hosts_json")
          if (( ${#hosts[@]} == 0 )); then
            echo "::error::No NixOS hosts defined"
            exit 1
          fi
          for host in "${hosts[@]}"; do
            echo "::group::Evaluate $host"
            nix eval --raw ".#nixosConfigurations.\"$host\".config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

      # Evaluate flake outputs without compiling the whole NixOS desktop.
      - name: Validate flake outputs
        run: nix flake check --no-build --show-trace

      # Hibernation must point to the encrypted LVM swap, not the empty default.
      - name: Verify Thoth hibernation resume device
        shell: bash
        run: |
          resume="$(nix eval --raw '.#nixosConfigurations.thoth.config.boot.resumeDevice')"
          swap="$(nix eval --raw --apply 'swaps: (builtins.head swaps).device' '.#nixosConfigurations.thoth.config.swapDevices')"
          if [[ "$resume" != "/dev/nixos/swap" || "$swap" != "$resume" ]]; then
            echo "::error::Thoth resume '$resume' must match swap '$swap' at /dev/nixos/swap"
            exit 1
          fi

      # Regression check for unattended laptop hibernation and UPower thresholds.
      - name: Verify Thoth laptop power policy
        shell: bash
        run: |
          lid="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.logind.settings.Login.HandleLidSwitch')"
          delay="$(nix eval --raw '.#nixosConfigurations.thoth.config.systemd.sleep.settings.Sleep.HibernateDelaySec')"
          battery_action="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.upower.criticalPowerAction')"
          battery_percent="$(nix eval --json '.#nixosConfigurations.thoth.config.services.upower.percentageAction')"
          upower_enabled="$(nix eval --json '.#nixosConfigurations.thoth.config.services.upower.enable')"
          [[ "$lid" == "suspend-then-hibernate" ]] || exit 1
          [[ "$delay" == "60min" ]] || exit 1
          [[ "$battery_action" == "Hibernate" ]] || exit 1
          [[ "$battery_percent" == "8" && "$upower_enabled" == "true" ]] || exit 1

      # Battery protection must not depend on a desktop client activating UPower.
      - name: Verify UPower starts without a desktop client
        shell: bash
        run: |
          nix eval --no-write-lock-file --json --apply 'services: services.upower.wantedBy or []' \
            '.#nixosConfigurations.thoth.config.systemd.services' \
            | jq -e 'index("multi-user.target") != null'

      # Regression check for the previously mismatched NetBird client/interface.
      - name: Verify NetBird interface
        shell: bash
        run: |
          interface="$(nix eval --raw '.#nixosConfigurations.thoth.config.services.netbird.clients.wt0.interface')"
          if [[ "$interface" != "wt0" ]]; then
            echo "::error::Expected NetBird interface wt0; got '$interface'"
            exit 1
          fi

      - name: Verify Argus headless NVR baseline
        shell: bash
        run: |
          nix eval --no-write-lock-file --json --apply 'c: {
            hostname = c.networking.hostName;
            adminKeys = c.users.users.twins.openssh.authorizedKeys.keys;
            facter = c.hardware.facter.enable;
            reportName = if c.hardware.facter.reportPath == null then "" else builtins.baseNameOf c.hardware.facter.reportPath;
            initrdModules = c.boot.initrd.availableKernelModules;
            netbird = c.services.netbird.clients.wt0.interface;
            dhcp = c.networking.useDHCP;
            frigate = c.services.frigate.enable;
            cameras = c.services.frigate.settings.cameras;
            detect = c.services.frigate.settings.detect.enabled;
            record = c.services.frigate.settings.record.enabled;
            mqtt = c.services.frigate.settings.mqtt.enabled;
            database = c.services.frigate.settings.database.path;
            hwaccel = c.services.frigate.settings.ffmpeg.hwaccel_args;
            mediaType = c.fileSystems."/var/lib/frigate".fsType;
            rootType = c.fileSystems."/".fsType;
            bcachefsSupport = c.boot.supportedFilesystems.bcachefs or false;
            systemdInitrd = c.boot.initrd.systemd.enable;
            rootDisk = c.disko.devices.disk.system.device;
            mediaDisk = c.disko.devices.disk.media.device;
            mountDependencies = c.systemd.services.frigate.unitConfig.RequiresMountsFor;
            mountGuard = c.systemd.services.frigate.unitConfig.ConditionPathIsMountPoint;
            nvidia = c.hardware.nvidia.enabled;
            openDriver = c.hardware.nvidia.open;
            xserver = c.services.xserver.enable;
            greetd = c.services.greetd.enable;
            networkmanager = c.networking.networkmanager.enable;
            onepassword = c.programs._1password-gui.enable;
            httpPorts = c.networking.firewall.interfaces.wt0.allowedTCPPorts;
            globalPorts = c.networking.firewall.allowedTCPPorts;
            sleep = c.systemd.targets.sleep.enable;
            stateVersion = c.system.stateVersion;
          }' '.#nixosConfigurations.argus.config' | jq -e '
            .hostname == "argus" and .netbird == "wt0" and .dhcp and .frigate
            and (.adminKeys | length > 0 and all(.[]; startswith("ssh-ed25519 ")))
            and .facter and .reportName == "facter.json"
            and (.initrdModules | index("ahci") != null and index("sd_mod") != null)
            and .cameras == {} and (.detect | not) and (.record | not) and (.mqtt | not)
            and .database == "/var/lib/frigate-db/frigate.db"
            and .hwaccel == "preset-nvidia"
            and .mediaType == "xfs" and .rootType == "bcachefs"
            and .bcachefsSupport and .systemdInitrd
            and .rootDisk == "/dev/disk/by-id/ata-GIGASTONE_SSD_128GB_GSTPDEGAAB25250706"
            and .mediaDisk == "/dev/disk/by-id/ata-ST4000VN008-2DR166_ZDHBZ39G"
            and (.mountDependencies | index("/var/lib/frigate") != null)
            and .mountGuard == "/var/lib/frigate"
            and .nvidia and .openDriver
            and (.xserver | not) and (.greetd | not) and (.networkmanager | not) and (.onepassword | not)
            and (.httpPorts | index(80) != null)
            and (.globalPorts | index(80) == null)
            and (.sleep | not) and .stateVersion == "26.05"
          '

      - name: Verify Odin headless base and storage
        shell: bash
        run: |
          nix eval --no-write-lock-file --json --apply 'c: {
            hostname = c.networking.hostName;
            adminKeys = c.users.users.twins.openssh.authorizedKeys.keys;
            facter = c.hardware.facter.enable;
            reportName = if c.hardware.facter.reportPath == null then "" else builtins.baseNameOf c.hardware.facter.reportPath;
            initrdModules = c.boot.initrd.availableKernelModules;
            rootType = c.fileSystems."/".fsType;
            espType = c.fileSystems."/boot".fsType;
            rootDisk = c.disko.devices.disk.system.device;
            diskCount = builtins.length (builtins.attrNames c.disko.devices.disk);
            partitions = builtins.attrNames c.disko.devices.disk.system.content.partitions;
            espSize = c.disko.devices.disk.system.content.partitions.ESP.size;
            swapSize = c.disko.devices.disk.system.content.partitions.swap.size;
            swapCount = builtins.length c.swapDevices;
            bcachefsSupport = c.boot.supportedFilesystems.bcachefs or false;
            compression = c.disko.devices.bcachefs_filesystems."odin-root".extraFormatArgs;
            systemdInitrd = c.boot.initrd.systemd.enable;
            zram = c.zramSwap.enable;
            lvmGroups = builtins.attrNames c.disko.devices.lvm_vg;
            luks = c.boot.initrd.luks.devices;
            systemdBoot = c.boot.loader.systemd-boot.enable;
            microcode = c.hardware.cpu.amd.updateMicrocode;
            bluetooth = c.hardware.bluetooth.enable;
            bluetoothUnit = c.systemd.services.bluetooth.enable or false;
            bluezInstalled = builtins.any (p: (p.pname or "") == "bluez") c.environment.systemPackages;
            netbird = c.services.netbird.clients.wt0.interface;
            dhcp = c.networking.useDHCP;
            ssh = c.services.openssh.enable;
            xserver = c.services.xserver.enable;
            greetd = c.services.greetd.enable;
            networkmanager = c.networking.networkmanager.enable;
            onepassword = c.programs._1password-gui.enable;
            docker = c.virtualisation.docker.enable;
            podman = c.virtualisation.podman.enable;
            ollama = c.services.ollama.enable;
            frigate = c.services.frigate.enable;
            sleep = c.systemd.targets.sleep.enable;
            suspend = c.systemd.targets.suspend.enable;
            hibernate = c.systemd.targets.hibernate.enable;
            hybridSleep = c.systemd.targets.hybrid-sleep.enable;
            suspendThenHibernate = c.systemd.targets.suspend-then-hibernate.enable;
            stateVersion = c.system.stateVersion;
          }' '.#nixosConfigurations.odin.config' | jq -e '
            .hostname == "odin" and .netbird == "wt0" and .dhcp and .ssh
            and (.adminKeys | index("ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMWQySUPlG4H7prC8ftuSz52jQT8v7g7pzCPhB5b7MT") != null)
            and .facter and .reportName == "facter.json"
            and (.initrdModules | index("nvme") != null)
            and .rootType == "bcachefs" and .espType == "vfat"
            and .rootDisk == "/dev/disk/by-id/nvme-addlink_M.2_PCIE_G5x4_NVMe_A4D01953036200206341"
            and .diskCount == 1 and .partitions == ["ESP", "root", "swap"]
            and .espSize == "1G" and .swapSize == "4G" and .swapCount == 1
            and .bcachefsSupport and (.compression | index("--compression=zstd") != null)
            and .systemdInitrd and .systemdBoot and .microcode
            and (.bluetooth | not) and (.bluetoothUnit | not) and (.bluezInstalled | not)
            and (.zram | not) and .lvmGroups == [] and .luks == {}
            and (.xserver | not) and (.greetd | not) and (.networkmanager | not) and (.onepassword | not)
            and (.docker | not) and (.podman | not) and (.ollama | not) and (.frigate | not)
            and (.sleep | not) and (.suspend | not) and (.hibernate | not)
            and (.hybridSleep | not) and (.suspendThenHibernate | not)
            and .stateVersion == "26.05"
          '

      # Mango and Niri must both remain available through the session chooser.
      - name: Verify Thoth desktop sessions
        shell: bash
        run: |
          nix eval --json --apply 'c: {
            niri = c.programs.niri.enable;
            mango = c.programs.mango.enable;
            sddm = c.services.displayManager.sddm.enable;
            greetd = c.services.greetd.enable;
            textGreeter = c.services.greetd.useTextGreeter;
            greeterCommand = if c.services.greetd.enable then (c.services.greetd.settings.default_session.command or "") else "";
            greeterUser = if c.services.greetd.enable then (c.services.greetd.settings.default_session.user or "") else "";
            autoLogin = c.services.displayManager.autoLogin.enable || (c.services.greetd.enable && (c.services.greetd.settings ? initial_session));
            sessionDirectory = "${c.services.displayManager.sessionData.desktops}/share/wayland-sessions";
            sessions = builtins.concatLists (map (p: p.providedSessions) c.services.displayManager.sessionPackages);
            mangoSessionTarget = builtins.elem c.programs.mango.package c.systemd.packages;
            stateVersion = c.system.stateVersion;
          }' '.#nixosConfigurations.thoth.config' | jq -e '
            .niri and .mango and (.sddm | not) and .greetd and .textGreeter
            and .greeterUser == "greeter" and (.autoLogin | not)
            and (.greeterCommand | contains("tuigreet") and contains("--sessions") and contains("--xsessions") and contains("--remember-user-session") and (contains("--cmd") | not) and (contains("--env") | not))
            and (.sessionDirectory as $directory | .greeterCommand | contains($directory))
            and (.sessions | index("niri") != null and index("mango") != null)
            and .mangoSessionTarget
            and .stateVersion == "26.05"
          '

      - name: Verify Quickshell is installed
        shell: bash
        run: |
          nix eval --no-write-lock-file --json \
            --apply 'packages: builtins.any (p: (p.pname or "") == "quickshell") packages' \
            '.#nixosConfigurations.thoth.config.environment.systemPackages' | jq -e '.'

      - name: Verify Mango Waybar autostart
        shell: bash
        run: |
          nix eval --no-write-lock-file --json --apply 'c: {
            wantedBy = c.systemd.user.services.waybar.wantedBy or [];
            condition = c.systemd.user.services.waybar.unitConfig.ConditionEnvironment or "";
            packagedUnit = builtins.any (p: (p.pname or "") == "waybar") c.systemd.packages;
          }' '.#nixosConfigurations.thoth.config' | jq -e '
            .wantedBy == ["mango-session.target"]
            and .condition == "WAYLAND_DISPLAY"
            and .packagedUnit
          '

      - name: Verify Mango Mako autostart
        shell: bash
        run: |
          nix eval --no-write-lock-file --json --apply 'c: {
            wantedBy = c.systemd.user.services.mako.wantedBy or [];
            condition = c.systemd.user.services.mako.unitConfig.ConditionEnvironment or "";
            packagedUnit = builtins.any (p: (p.pname or "") == "mako") c.systemd.packages;
          }' '.#nixosConfigurations.thoth.config' | jq -e '
            .wantedBy == ["mango-session.target"]
            and .condition == "WAYLAND_DISPLAY"
            and .packagedUnit
          '

      - name: Verify Mango awww autostart
        shell: bash
        run: |
          nix eval --no-write-lock-file --json --apply 'c: let
            s = c.systemd.user.services.awww or {};
            packages = builtins.filter (p: (p.pname or "") == "awww") c.environment.systemPackages;
            package = if packages == [] then null else builtins.head packages;
          in {
            installed = package != null;
            wantedBy = s.wantedBy or [];
            partOf = s.partOf or [];
            after = s.after or [];
            condition = s.unitConfig.ConditionEnvironment or "";
            command = s.serviceConfig.ExecStart or "";
            daemonCommand = if package != null then "${package}/bin/awww-daemon" else "";
            type = s.serviceConfig.Type or "";
            restart = s.serviceConfig.Restart or "";
          }' '.#nixosConfigurations.thoth.config' | jq -e '
            .installed
            and .wantedBy == ["mango-session.target"]
            and .partOf == ["mango-session.target"]
            and .after == ["graphical-session.target"]
            and .condition == "WAYLAND_DISPLAY"
            and .command == .daemonCommand
            and .type == "simple" and .restart == "on-failure"
          '

      - name: Verify compositor-independent Wayland locking
        shell: bash
        run: |
          nix eval --json --apply 'c: let
            s = c.systemd.user.services.swayidle;
            package = name: builtins.head (builtins.filter (p: (p.pname or "") == name) c.environment.systemPackages);
          in {
            wantedBy = s.wantedBy;
            partOf = s.partOf;
            after = s.after;
            condition = s.unitConfig.ConditionEnvironment or "";
            command = s.serviceConfig.ExecStart;
            idleCommand = "${package "swayidle"}/bin/swayidle";
            lockCommand = "${package "swaylock-effects"}/bin/swaylock -f";
            restart = s.serviceConfig.Restart;
            pam = builtins.hasAttr "swaylock" c.security.pam.services;
          }' '.#nixosConfigurations.thoth.config' | jq -e '
            .wantedBy == ["graphical-session.target"]
            and .partOf == ["graphical-session.target"]
            and .after == ["graphical-session.target"]
            and .condition == "WAYLAND_DISPLAY"
            and .restart == "on-failure" and .pam
            and (. as $c | (.command | split("\u0027")) == [($c.idleCommand + " -w -C /dev/null lock "), $c.lockCommand, " before-sleep ", $c.lockCommand, ""])
          '

  lint:
    name: Nix style and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Cosmos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Packages are supplied by the pinned Cosmos development shell.
      - name: Statix
        run: nix develop --command statix check .

      - name: Deadnix
        if: ${{ success() || failure() }}
        run: nix develop --command deadnix --fail .

      # Format only in CI's disposable checkout; fail with the resulting diff.
      # This never commits or changes the contributor's working tree.
      - name: Nixfmt
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          nix develop --command bash -euo pipefail -c '
            git ls-files -z -- "*.nix" | xargs -0 -r -n1 nixfmt
            git diff --exit-code -- "*.nix"
          '
